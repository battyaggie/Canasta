# Temporary: builds the unsigned Meta Quest app package so it can be signed elsewhere.
name: Build Quest app (unsigned)
on:
  push:
    branches: [claude/project-thread-5z88ov]
    paths: ['quest-app/android/**', '.github/workflows/quest-apk.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Build
        working-directory: quest-app/android
        run: ./gradlew --no-daemon assembleRelease
      - name: Commit the result
        run: |
          mkdir -p quest-app/out
          cp quest-app/android/app/build/outputs/apk/release/*.apk quest-app/out/
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          cp $BT/lib/apksigner.jar $BT/zipalign quest-app/out/
          echo "$BT" > quest-app/out/build-tools.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -f quest-app/out
          git commit -m "Unsigned Quest app build"
          git push
